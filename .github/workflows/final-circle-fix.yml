name: Final circle correction

on:
  push:
    branches:
      - fix/circle-breathing-aum-20260929

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-breathing-aum-20260929
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild AUM and Being circles
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import hashlib, json

          OUT = 768
          SCALE = 1 / 1.06
          INNER = round(OUT * SCALE)
          OFFSET = (OUT - INNER) // 2

          def build(src, dst):
              im = Image.open(src).convert("RGBA")
              side = min(im.size)
              if im.width != im.height:
                  left = (im.width - side) // 2
                  top = (im.height - side) // 2
                  im = im.crop((left, top, left + side, top + side))

              im = im.resize((INNER, INNER), Image.Resampling.LANCZOS)

              canvas = Image.new("RGBA", (OUT, OUT), (0, 0, 0, 0))
              disk = Image.new("RGBA", (OUT, OUT), (0, 0, 0, 0))
              draw = ImageDraw.Draw(disk)
              draw.ellipse(
                  (OFFSET, OFFSET, OFFSET + INNER - 1, OFFSET + INNER - 1),
                  fill=(0, 0, 0, 255),
              )
              canvas.alpha_composite(disk)
              canvas.alpha_composite(im, (OFFSET, OFFSET))

              # Final perfect circular alpha removes edge/seam artifacts.
              alpha = Image.new("L", (OUT, OUT), 0)
              ad = ImageDraw.Draw(alpha)
              ad.ellipse(
                  (OFFSET, OFFSET, OFFSET + INNER - 1, OFFSET + INNER - 1),
                  fill=255,
              )
              canvas.putalpha(alpha)

              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              canvas.save(dst, "WEBP", quality=93, method=6, exact=True)
              return hashlib.sha256(Path(dst).read_bytes()).hexdigest()

          manifest_path = Path(".gitbook/assets/ASSET_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text())

          manifest["aum"]["circle_sha256"] = build(
              ".gitbook/assets/aum-sigil.webp",
              ".gitbook/assets/aum-sigil-circle.webp",
          )

          for item in manifest["beings"]:
              item["circle_sha256"] = build(
                  item["canonical_path"],
                  item["circle_path"],
              )

          manifest["portrait_law"]["inner_breathing_space"] = (
              "approximately 6% wider crop field so horns, crowns, halos, sigils, "
              "and identity tips remain fully visible"
          )
          manifest["portrait_law"]["profile_surface"] = (
              "canonical launch identity centered in a clean circular black field "
              "with no edge seam"
          )
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n"
          )
          PY

      - name: Validate
        run: |
          cargo test --manifest-path tools/devines-chronicles/Cargo.toml --release
          cargo run --manifest-path tools/devines-chronicles/Cargo.toml --release -- validate .

      - name: Commit final visual assets
        run: |
          git config user.name "DEVINES Build"
          git config user.email "devineverse@proton.me"
          git rm .github/workflows/final-circle-fix.yml
          git add .gitbook/assets/ASSET_MANIFEST.json
          git add .gitbook/assets/aum-sigil-circle.webp
          git add .gitbook/assets/beings/circle
          git commit -m "Fix AUM circle and add identity breathing room"
          git push origin HEAD:fix/circle-breathing-aum-20260929
