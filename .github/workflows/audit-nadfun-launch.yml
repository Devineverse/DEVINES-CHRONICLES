name: Audit NadFun Launch Identity

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image audit tools
        run: python -m pip install --quiet pillow imagehash

      - name: Audit founder NadFun identities and portraits
        env:
          CREATOR: "0xEA0144B94d7CfeC904853e1Fe4CC569D6aBDDCe0"
        run: |
          python - <<'PY'
          import io, json, os, re, time, urllib.parse, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          import imagehash

          creator=os.environ["CREATOR"].lower()
          api="https://api.nadapp.net"
          headers={"Accept":"application/json","User-Agent":"DEVINES-Chronicle-Audit/2.0"}

          beings = {
            "D001":"GENESIS DRAGON","D002":"DUALITY DRAGON","D003":"TRINITY DRAGON",
            "D004":"FIRE DRAGON","D005":"WATER DRAGON","D006":"EARTH DRAGON",
            "D007":"AIR DRAGON","D008":"AETHER DRAGON","D009":"KING DRAGON",
            "D010":"QUEEN DRAGON","D011":"MONAD DRAGON","D012":"TIME DRAGON",
            "D013":"SPACE DRAGON","D014":"LIFE DRAGON","D015":"WISDOM DRAGON",
            "D016":"TRUTH DRAGON","D017":"BALANCE DRAGON","D018":"JUSTICE DRAGON",
            "D019":"HOPE DRAGON","D020":"DESTINY DRAGON","D021":"UNITY DRAGON",
            "D022":"ETERNITY DRAGON","D174":"FOUNDATION DRAGON","D285":"RESTORATION DRAGON",
            "D396":"LIBERATION DRAGON","D417":"TRANSFORMATION DRAGON","D528":"CREATION DRAGON",
            "D639":"CONNECTION DRAGON","D741":"TRUTH DRAGON","D852":"AWAKENING DRAGON",
            "D963":"ASCENSION DRAGON","SUN":"DEVINES SUN","MOON":"DEVINES MOON",
            "MASTER":"DEVINES MASTER"
          }

          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          def creator_ok(ti):
              cr=ti.get("creator") or {}
              aid=(cr.get("account_id") if isinstance(cr,dict) else cr) or ""
              return str(aid).lower()==creator

          def norm(s):
              return re.sub(r"[^A-Z0-9]+"," ",str(s or "").upper()).strip()

          def claims_id(ti,bid):
              sym=norm(ti.get("symbol"))
              desc=norm(ti.get("description"))
              name=norm(ti.get("name"))
              if bid in ("SUN","MOON","MASTER"):
                  return bid in sym.split() or bid in name.split() or f"ID {bid}" in desc
              return bid==sym or bid in desc.split() or f"ID {bid}" in desc

          def name_score(ti,expected):
              n=norm(ti.get("name"))
              e=norm(expected)
              d=norm(ti.get("description"))
              score=0
              if n==e: score+=100
              if e in n: score+=60
              if e in d: score+=40
              return score

          candidates={bid:{} for bid in beings}
          for bid,expected in beings.items():
              terms=[expected,bid]
              if bid.startswith("D") and bid[1:].isdigit():
                  terms.append("DRAGON "+bid[1:])
              for term in terms:
                  try:
                      data=get_json(api+"/search/"+urllib.parse.quote(term))
                      toks=data.get("token_result",{}).get("tokens",[])
                      for item in toks:
                          ti=item.get("token_info",{})
                          if not creator_ok(ti):
                              continue
                          ca=ti.get("token_id")
                          if not ca: continue
                          if claims_id(ti,bid) or name_score(ti,expected)>=100:
                              candidates[bid][ca.lower()]={"token_info":ti,"market_info":item.get("market_info",{})}
                  except Exception as e:
                      print("SEARCH_ERROR",json.dumps({"id":bid,"term":term,"error":str(e)},sort_keys=True))
                  time.sleep(1)

          audit=[]
          for bid,expected in beings.items():
              opts=list(candidates[bid].values())
              opts.sort(key=lambda item:(
                  1 if claims_id(item["token_info"],bid) else 0,
                  name_score(item["token_info"],expected),
                  int(item["token_info"].get("created_at") or 0)
              ),reverse=True)

              if not opts:
                  rec={"being_id":bid,"expected_name":expected,"status":"NOT_FOUND"}
                  audit.append(rec); print("AUDIT",json.dumps(rec,sort_keys=True)); continue

              ti=opts[0]["token_info"]
              ca=ti.get("token_id")
              image_uri=ti.get("image_uri")
              local=Path(".gitbook/assets/beings")/f"{bid}.webp"
              ph=dh=None; match=False; err=None
              try:
                  req=urllib.request.Request(image_uri,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
                  with Image.open(io.BytesIO(raw)) as rim, Image.open(local) as lim:
                      rim=ImageOps.exif_transpose(rim).convert("RGB")
                      lim=ImageOps.exif_transpose(lim).convert("RGB")
                      ph=int(imagehash.phash(rim)-imagehash.phash(lim))
                      dh=int(imagehash.dhash(rim)-imagehash.dhash(lim))
                      match=(ph<=2 and dh<=2)
              except Exception as e:
                  err=str(e)

              rec={
                  "being_id":bid,"expected_name":expected,"status":"FOUND",
                  "name":ti.get("name"),"ticker":ti.get("symbol"),"ca":ca,
                  "nad_fun_url":f"https://nad.fun/tokens/{ca}",
                  "image_uri":image_uri,"created_at":ti.get("created_at"),
                  "description":ti.get("description"),
                  "identity_claim_ok":claims_id(ti,bid),
                  "name_score":name_score(ti,expected),
                  "candidate_count":len(opts),
                  "phash_distance":ph,"dhash_distance":dh,
                  "image_match":match,"image_error":err
              }
              audit.append(rec); print("AUDIT",json.dumps(rec,sort_keys=True))

          print("AUDIT_SUMMARY",json.dumps({
              "expected":len(beings),
              "found":sum(x["status"]=="FOUND" for x in audit),
              "missing":[x["being_id"] for x in audit if x["status"]!="FOUND"],
              "identity_failures":[x["being_id"] for x in audit if x["status"]=="FOUND" and not x.get("identity_claim_ok")],
              "portrait_mismatches":[x["being_id"] for x in audit if x["status"]=="FOUND" and not x.get("image_match")],
          },sort_keys=True))
          PY
