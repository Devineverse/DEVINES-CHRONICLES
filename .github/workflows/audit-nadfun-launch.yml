name: Audit NadFun Launch Identity

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/chronicle-six-books-v1
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet pillow imagehash

      - name: Verify NadFun identities and build canonical portrait layers
        env:
          CREATOR: "0xEA0144B94d7CfeC904853e1Fe4CC569D6aBDDCe0"
          CANONICAL_AUM: "0x079f07f2eb3a59ba34c38c6fcf5059f398cb7777"
        run: |
          python - <<'PY'
          import io, json, os, re, urllib.request
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps
          import imagehash

          creator=os.environ["CREATOR"]
          canonical_aum=os.environ["CANONICAL_AUM"].lower()
          api="https://api.nadapp.net"
          headers={"Accept":"application/json","User-Agent":"DEVINES-Chronicle-Audit/4.0"}

          beings = {
            "D001":"GENESIS DRAGON","D002":"DUALITY DRAGON","D003":"TRINITY DRAGON",
            "D004":"FIRE DRAGON","D005":"WATER DRAGON","D006":"EARTH DRAGON",
            "D007":"AIR DRAGON","D008":"AETHER DRAGON","D009":"KING DRAGON",
            "D010":"QUEEN DRAGON","D011":"MONAD DRAGON","D012":"TIME DRAGON",
            "D013":"SPACE DRAGON","D014":"LIFE DRAGON","D015":"WISDOM DRAGON",
            "D016":"TRUTH DRAGON","D017":"BALANCE DRAGON","D018":"JUSTICE DRAGON",
            "D019":"HOPE DRAGON","D020":"DESTINY DRAGON","D021":"UNITY DRAGON",
            "D022":"ETERNITY DRAGON","D174":"FOUNDATION DRAGON","D285":"RESTORATION DRAGON",
            "D396":"LIBERATION DRAGON","D417":"TRANSFORMATION DRAGON","D528":"CREATION DRAGON",
            "D639":"CONNECTION DRAGON","D741":"TRUTH DRAGON","D852":"AWAKENING DRAGON",
            "D963":"ASCENSION DRAGON","SUN":"DEVINES SUN","MOON":"DEVINES MOON",
            "MASTER":"DEVINES MASTER"
          }

          def get_json(path):
              req=urllib.request.Request(api+path,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode())

          def norm(s):
              return re.sub(r"[^A-Z0-9]+"," ",str(s or "").upper()).strip()

          def extract_items(data):
              if isinstance(data,list): return data
              if not isinstance(data,dict): return []
              for key in ("tokens","items","results","data"):
                  val=data.get(key)
                  if isinstance(val,list): return val
                  if isinstance(val,dict):
                      for k2 in ("tokens","items","results"):
                          if isinstance(val.get(k2),list): return val[k2]
              return []

          data=get_json(f"/profile/tokens/created/{creator}?page=1&limit=100")
          items=extract_items(data)
          normalized=[]
          for item in items:
              ti=item.get("token_info",item) if isinstance(item,dict) else {}
              ca=str(ti.get("token_id") or ti.get("address") or "")
              if ca: normalized.append({"token_info":ti,"raw":item})

          def explicit_ids(ti):
              desc=norm(ti.get("description"))
              ids=set(re.findall(r"\bD\d{3}\b",desc))
              sym=norm(ti.get("symbol"))
              if re.fullmatch(r"D\d{3}",sym): ids.add(sym)
              name=norm(ti.get("name"))
              m=re.fullmatch(r"DRAGON (?:# )?(\d{3})",name)
              if m: ids.add("D"+m.group(1))
              return ids

          def created_at(item):
              return int(item["token_info"].get("created_at") or item["raw"].get("created_at") or 0)

          by_id={k:[] for k in beings}
          aum=[]
          for item in normalized:
              ti=item["token_info"]
              ca=str(ti.get("token_id") or ti.get("address") or "")
              sym=norm(ti.get("symbol")); name=norm(ti.get("name"))
              for bid in explicit_ids(ti):
                  if bid in by_id: by_id[bid].append(item)
              if sym in ("SUN","MOON","MASTER") and sym in by_id: by_id[sym].append(item)
              elif "DEVINES SUN" in name: by_id["SUN"].append(item)
              elif "DEVINES MOON" in name: by_id["MOON"].append(item)
              elif "DEVINES MASTER" in name: by_id["MASTER"].append(item)
              if sym=="AUM" or ca.lower()==canonical_aum: aum.append(item)

          selected={}
          duplicates={}
          for bid in beings:
              opts=sorted({str(x["token_info"].get("token_id")).lower(): x for x in by_id[bid]}.values(), key=created_at, reverse=True)
              if len(opts)>1:
                  duplicates[bid]=[{"ca":o["token_info"].get("token_id"),"created_at":created_at(o)} for o in opts]
              if not opts: raise SystemExit(f"MISSING_CANONICAL_BEING:{bid}")
              selected[bid]=opts[0]

          aum_matches=[x for x in sorted(aum,key=created_at,reverse=True) if str(x["token_info"].get("token_id") or "").lower()==canonical_aum]
          if not aum_matches: raise SystemExit("MISSING_CANONICAL_AUM")

          source_dir=Path(".gitbook/assets/beings-source")
          hero_dir=Path(".gitbook/assets/beings")
          source_dir.mkdir(parents=True,exist_ok=True)
          hero_dir.mkdir(parents=True,exist_ok=True)

          SIZE=1200
          OUTER=1160
          ART_BOX=1010
          TOP=72
          RIM=(166,139,250,220)
          manifest={"schema":"devines.being-visual-market.v1","source":"nad.fun founder-created token ledger","beings":{}}

          for bid,item in selected.items():
              ti=item["token_info"]
              ca=ti.get("token_id"); uri=ti.get("image_uri")
              req=urllib.request.Request(uri,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=45) as r: raw=r.read()
              src=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")

              # Untouched visual content layer from the canonical Nad.fun launch asset.
              src.save(source_dir/f"{bid}.webp","WEBP",quality=100,method=6)

              # Top-center portrait inside a true circular identity field.
              # Black inner space protects horns, crowns, halos and the full head.
              fitted=ImageOps.contain(src,(ART_BOX,ART_BOX),Image.Resampling.LANCZOS)
              hero=Image.new("RGBA",(SIZE,SIZE),(0,0,0,0))
              left=(SIZE-OUTER)//2; top=(SIZE-OUTER)//2
              draw=ImageDraw.Draw(hero)
              draw.ellipse((left,top,left+OUTER,top+OUTER),fill=(0,0,0,255),outline=RIM,width=4)
              x=(SIZE-fitted.width)//2
              y=TOP
              hero.alpha_composite(fitted.convert("RGBA"),(x,y))
              mask=Image.new("L",(SIZE,SIZE),0)
              md=ImageDraw.Draw(mask)
              md.ellipse((left,top,left+OUTER,top+OUTER),fill=255)
              hero.putalpha(mask)
              hero.save(hero_dir/f"{bid}.webp","WEBP",lossless=True,method=6)

              # Verify the preserved source remains visually identical to Nad.fun.
              with Image.open(source_dir/f"{bid}.webp") as check:
                  check=check.convert("RGB")
                  ph=int(imagehash.phash(src)-imagehash.phash(check))
                  dh=int(imagehash.dhash(src)-imagehash.dhash(check))
                  if ph>2 or dh>2: raise SystemExit(f"SOURCE_IMAGE_MISMATCH:{bid}:{ph}:{dh}")

              manifest["beings"][bid]={
                  "name":ti.get("name"),"ticker":ti.get("symbol"),"ca":ca,
                  "nad_fun_url":f"https://nad.fun/tokens/{ca}",
                  "nad_image_uri":uri,
                  "source_asset":f".gitbook/assets/beings-source/{bid}.webp",
                  "hero_asset":f".gitbook/assets/beings/{bid}.webp",
                  "created_at":created_at(item)
              }
              print("CANONICAL",json.dumps({"being_id":bid,**manifest["beings"][bid]},sort_keys=True))

          aum_ti=aum_matches[0]["token_info"]
          manifest["aum"]={
              "ticker":aum_ti.get("symbol"),"ca":aum_ti.get("token_id"),
              "nad_fun_url":f"https://nad.fun/tokens/{aum_ti.get('token_id')}",
              "nad_image_uri":aum_ti.get("image_uri")
          }
          Path(".gitbook/assets/BEING_IDENTITY_MANIFEST.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("DUPLICATES",json.dumps(duplicates,sort_keys=True))
          print("PASS",json.dumps({"beings":len(selected),"canonical_sources":len(list(source_dir.glob("*.webp"))),"circular_heroes":len(list(hero_dir.glob("*.webp"))),"aum":manifest["aum"]["ca"]},sort_keys=True))
          PY

      - name: Commit canonical portraits
        run: |
          git config user.name "DEVINES Chronicle"
          git config user.email "actions@users.noreply.github.com"
          git add .gitbook/assets/beings-source .gitbook/assets/beings .gitbook/assets/BEING_IDENTITY_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Portraits already canonical"
          else
            git commit -m "Chronicles: align all Being portraits to NadFun circular identity"
            git push origin HEAD:astra/chronicle-six-books-v1
          fi