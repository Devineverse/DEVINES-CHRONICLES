name: Sync Canonical Identity Art

on:
  push:
    branches:
      - astra/chronicle-six-books-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Sync NadFun originals and build DEVINES portrait surfaces
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request
          from pathlib import Path
          from PIL import Image, ImageDraw

          root=Path(".")
          beings=root/".gitbook/assets/beings"
          circle_dir=beings/"circle"
          hero_dir=beings/"hero"
          circle_dir.mkdir(parents=True,exist_ok=True)
          hero_dir.mkdir(parents=True,exist_ok=True)

          urls={
            "D001":"https://storage.nadapp.net/coin/1a9f288c-f1c2-4586-ae62-95baff1ce44c",
            "D002":"https://storage.nadapp.net/coin/20d85281-1f86-42f8-a4ee-f0462d689faf",
            "D003":"https://storage.nadapp.net/coin/8504d155-4022-47bc-92f7-ccb64da89213",
            "D004":"https://storage.nadapp.net/coin/e5e89be8-82f9-4f26-ac58-2bdd7e6e4de9",
            "D005":"https://storage.nadapp.net/coin/5fbab5c7-8460-4a52-a12f-de073a14a0b6",
            "D006":"https://storage.nadapp.net/coin/0ecd5614-db51-4d67-b822-18e61d4fb8d9",
            "D007":"https://storage.nadapp.net/coin/84860a75-e197-4e9e-adee-88daed59e2a1",
            "D008":"https://storage.nadapp.net/coin/c888f767-d89a-4b3c-bf8b-e7cdba7eeb99",
            "D009":"https://storage.nadapp.net/coin/df3436e1-0679-4d96-9253-482c783a5c35",
            "D010":"https://storage.nadapp.net/coin/ad78af92-cc3d-492e-be2b-0355ab751574",
            "D011":"https://storage.nadapp.net/coin/88b5ea8f-a87a-4a57-a051-874987168847",
            "D012":"https://storage.nadapp.net/coin/8a5c1c78-7e86-4093-8117-9d80ac57a8ea",
            "D013":"https://storage.nadapp.net/coin/541a8318-bdab-4df1-9aca-9ca2182c09b2",
            "D014":"https://storage.nadapp.net/coin/6d7b8bba-1baf-4a1f-8cdb-a62554882812",
            "D015":"https://storage.nadapp.net/coin/57dedaa7-8746-45e6-8092-b29e6009e9d0",
            "D016":"https://storage.nadapp.net/coin/edc1fcb6-8eb0-44e7-bee9-565603b7fa09",
            "D017":"https://storage.nadapp.net/coin/632673f4-3144-4c21-b822-b4777ac3a5cc",
            "D018":"https://storage.nadapp.net/coin/368c9f98-d8cb-4837-a445-d489e56688c3",
            "D019":"https://storage.nadapp.net/coin/88fa6e0e-368b-4bb9-a2f0-b7aed8969350",
            "D020":"https://storage.nadapp.net/coin/4b128ac6-e132-4cff-9f15-b0df88cb628b",
            "D021":"https://storage.nadapp.net/coin/b1fa8feb-65f0-4fa6-9303-2230574d318a",
            "D022":"https://storage.nadapp.net/coin/96bebf3e-d29f-4f88-be48-0dcd1dd7b246",
            "D174":"https://storage.nadapp.net/coin/aa0fae5b-d2d4-4d70-a28d-514889484e30",
            "D285":"https://storage.nadapp.net/coin/7aa00f89-b42e-45dd-95df-1ef95ac0ce44",
            "D396":"https://storage.nadapp.net/coin/e0c5866f-f226-4f96-a3b1-5d3b103195e4",
            "D417":"https://storage.nadapp.net/coin/b1b15625-6fe3-4fdc-bd28-7d2a7ce1ecfb",
            "D528":"https://storage.nadapp.net/coin/36fdd5d8-41f7-4e06-9bee-83c03b51e7dc",
            "D639":"https://storage.nadapp.net/coin/95c9c449-e631-4400-b107-ef2db3536b20",
            "D741":"https://storage.nadapp.net/coin/7bcf51c0-fb75-4b77-9133-2aa56d758402",
            "D852":"https://storage.nadapp.net/coin/5b3e205d-a664-4a69-9971-62ec223bd0c5",
            "D963":"https://storage.nadapp.net/coin/2178860c-8b5f-4e9a-abe5-459ec57ce06d",
            "SUN":"https://storage.nadapp.net/coin/ada77137-1cf4-4304-8c32-15a66278b587",
            "MOON":"https://storage.nadapp.net/coin/be040770-5517-401b-8c60-aed00c8e9788",
            "MASTER":"https://storage.nadapp.net/coin/6af87aab-ecdb-4ddc-a4dc-95694d147338",
          }
          aum_url="https://storage.nadapp.net/coin/98138818-aa60-4979-969c-d4e10e58482d"
          headers={"User-Agent":"DEVINES-Chronicle-Identity-Sync/1.0"}

          def download(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read()

          def canonicalize(raw,out):
              with Image.open(io.BytesIO(raw)) as im:
                  im=im.convert("RGB")
                  if im.size!=(1024,1024):
                      im=im.resize((1024,1024),Image.Resampling.LANCZOS)
                  im.save(out,"WEBP",quality=94,method=6)

          def make_circle(src,out,size=768):
              im=Image.open(src).convert("RGB")
              inner=int(size*0.88)
              im=im.resize((inner,inner),Image.Resampling.LANCZOS)
              base=Image.new("RGBA",(size,size),(0,0,0,255))
              pos=((size-inner)//2,(size-inner)//2)
              base.paste(im,pos)
              mask=Image.new("L",(size,size),0)
              d=ImageDraw.Draw(mask)
              edge=8
              d.ellipse((edge,edge,size-edge-1,size-edge-1),fill=255)
              circ=Image.new("RGBA",(size,size),(0,0,0,0))
              circ.paste(base,(0,0),mask)
              dr=ImageDraw.Draw(circ)
              dr.ellipse((edge,edge,size-edge-1,size-edge-1),outline=(221,207,255,235),width=4)
              circ.save(out,"WEBP",quality=92,method=6)

          def make_hero(circle,out):
              c=Image.open(circle).convert("RGBA")
              canvas=Image.new("RGBA",(1200,760),(0,0,0,255))
              display=650
              c=c.resize((display,display),Image.Resampling.LANCZOS)
              x=(1200-display)//2
              y=28
              canvas.alpha_composite(c,(x,y))
              canvas.convert("RGB").save(out,"WEBP",quality=92,method=6)

          for bid,url in urls.items():
              raw=download(url)
              canonicalize(raw,beings/f"{bid}.webp")
              make_circle(beings/f"{bid}.webp",circle_dir/f"{bid}.webp")
              make_hero(circle_dir/f"{bid}.webp",hero_dir/f"{bid}.webp")
              print("SYNC",bid)

          raw=download(aum_url)
          canonicalize(raw,root/".gitbook/assets/aum-sigil.webp")
          make_circle(root/".gitbook/assets/aum-sigil.webp",root/".gitbook/assets/aum-sigil-circle.webp")
          make_hero(root/".gitbook/assets/aum-sigil-circle.webp",root/".gitbook/assets/aum-sigil-hero.webp")

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          manifest={
            "schema":"devines.chronicles.visual-assets.v2",
            "authority":"Nad.fun founder-created canonical launch identity",
            "portrait_law":{
              "canonical_source":"unmodified identity composition re-encoded for web delivery",
              "profile_surface":"top-centered circular hero",
              "inner_breathing_space":"12%",
              "global_border":"AUM lavender",
              "global_background":"black",
              "being_colors":"preserved inside canonical portrait only"
            },
            "aum":{
              "source_uri":aum_url,
              "canonical_path":".gitbook/assets/aum-sigil.webp",
              "circle_path":".gitbook/assets/aum-sigil-circle.webp",
              "hero_path":".gitbook/assets/aum-sigil-hero.webp",
              "canonical_sha256":sha(root/".gitbook/assets/aum-sigil.webp")
            },
            "beings":[]
          }
          for bid,url in urls.items():
              manifest["beings"].append({
                "id":bid,
                "source_uri":url,
                "canonical_path":f".gitbook/assets/beings/{bid}.webp",
                "circle_path":f".gitbook/assets/beings/circle/{bid}.webp",
                "hero_path":f".gitbook/assets/beings/hero/{bid}.webp",
                "canonical_sha256":sha(beings/f"{bid}.webp"),
                "circle_sha256":sha(circle_dir/f"{bid}.webp"),
                "hero_sha256":sha(hero_dir/f"{bid}.webp"),
              })
          (root/".gitbook/assets/ASSET_MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY

      - name: Commit canonical identity art
        run: |
          git config user.name "DEVINES Chronicle"
          git config user.email "actions@users.noreply.github.com"
          git add .gitbook/assets
          if git diff --cached --quiet; then
            echo "No identity art changes."
            exit 0
          fi
          git commit -m "Chronicles: synchronize canonical NadFun identity art"
          git push
